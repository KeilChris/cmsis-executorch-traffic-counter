#
# Alif Ensemble E8 DevKit board bring-up for the Ethos-U85 NPU, running on the
# Cortex-M55 high-performance (HP) core. Derived from the pack's
# Boards/DevKit-e8/Layers/M55_HP/Board_HP-U85.clayer.yml and trimmed to what a
# headless ExecuTorch inference runner needs: device startup, the Secure
# Enclave services (clocks, pin mux), a UART-backed stdout on the PRG USB
# connector, the Ethos-U driver, and the MIPI DSI display (CDC200 controller,
# ILI9806E 480x800 panel) that the NPU render demo scans its frames out on.
# Ethernet, USB, VIO and the vStream drivers are omitted.
#
# This is the variant for the cat detector (yolo/yolo.cproject.yml): the
# same board files as Board-U85.clayer.yml plus the camera (MT9M114 on MIPI
# CSI-2, 640x480 RGB565 through the CPI in streaming mode, RTE_Device.h), the
# console in a log buffer that the debugger reads (SW4 stays on SEUART for
# the Secure Enclave tools; retarget_stdio_log.c, as for Quake), and a
# scatter file whose code region runs on into the MRAM user region: the
# YOLO26n program alone is 2.3 MB, more than the 2 MB HP region.
layer:
  type: Board
  description: DevKit-E8 board setup for the YOLO26 cat detector on M55_HP with the Ethos-U85
  for-board: Alif Semiconductor::DevKit-E8
  for-device: Alif Semiconductor::AE822FA0E5597LS0:M55_HP
  device: :M55_HP

  processor:
    trustzone: off

  connections:
    - connect: DevKit-E8 Board
      provides:
        - STDIN
        - STDOUT
        - STDERR
        - Heap: 98304

  define:
    - CMSIS_target_header: \"DevKit-E8.h\"
    - ETHOSU85
    # The application's ExecuTorch pools, its input tensor and the RTX
    # thread stack of main.c go into this section, in the 8 MB bulk SRAM
    # (NPU-accessible, behind the D-cache); yolo/app_yolo.cpp sizes them.
    - APP_POOL_SECTION: \".bss.ai_pool\"
    # The display: one 480x800 RGB888 frame buffer, next to the pools.
    - APP_HAS_DISPLAY: 1
    - APP_FRAMEBUFFER_SECTION: \".bss.lcd_frame_buf\"
    - APP_DISPLAY_WIDTH: 480
    - APP_DISPLAY_HEIGHT: 800
    - APP_THREAD_STACK_SIZE: 0x8000
    # The camera: MT9M114 over MIPI CSI-2 into the CPI, 640x480 RGB565,
    # four frame buffers the CPI cycles through (RTE_Device.h).
    - APP_HAS_CAMERA: 1
    # SDS recording and playback over the J-Link's RTT channel 1.
    - APP_HAS_SDS: 1

  packs:
    - pack: AlifSemiconductor::Ensemble@^2.2.0-0
    - pack: ARM::CMSIS@^6.2.0
    - pack: ARM::CMSIS-Compiler@^2.1.0
    - pack: ARM::ethos-u-core-driver@^1.26.2
    - pack: ARM::CMSIS-RTX@^5.9.1
    - pack: ARM::SDS@^3.1.0
    - pack: SEGGER::RTT@^8.58.0

  misc:
    - for-compiler: AC6
      Link:
        - '--diag_suppress 6312,6314,6329,6848'

  components:
    - component: Device:Startup

    - component: BSP:Board Config
    - component: BSP:DevKit Config&DevKit-e8

    - component: CMSIS:CORE

    - component: CMSIS Driver:USART
    # The ILI9806E panel driver drives its reset and backlight pins through
    # the CMSIS GPIO driver.
    - component: CMSIS Driver:GPIO
      define:
        - CMSIS_GPIO_DISABLE_EVENTS

    # RTX5: app_main runs in an RTX thread (main.c); the SDS Stream component needs it too.
    - component: CMSIS:RTOS2:Keil RTX5&Source
    - component: CMSIS:OS Tick:SysTick
    # SDS data streams over SEGGER RTT (the J-Link OB), read and written by SDSIO-Server.
    - component: SDS:Stream&CMSIS-RTOS2
    - component: SDS:IO:RTT
    - component: SEGGER:RTT

    - component: CMSIS-Compiler:CORE
    - component: CMSIS-Compiler:STDERR:Custom
    - component: CMSIS-Compiler:STDIN:Custom
    - component: CMSIS-Compiler:STDOUT:Custom

    - component: Device:SOC Peripherals:MHU
    - component: Device:SOC Peripherals:PINCONF

    # Display: CDC200 controller -> MIPI DSI -> ILI9806E panel (the pack's
    # RTE_Device.h in this layer configures RGB888, 480x800, 60 fps).
    - component: BSP:External peripherals:ILI9806E LCD panel
    - component: Device:SOC Peripherals:CDC
    - component: Device:SOC Peripherals:GPIO
    - component: Device:SOC Peripherals:MIPI DSI
    - component: Device:SOC Peripherals:MIPI DSI CSI2 DPHY

    # Camera: MT9M114 sensor (I2C1 for its registers) -> MIPI CSI-2 -> CPI -> SRAM.
    - component: BSP:External peripherals:CAMERA Sensor MT9M114
    - component: CMSIS Driver:I2C
    - component: Device:SOC Peripherals:CPI
    - component: Device:SOC Peripherals:MIPI CSI2

    - component: Machine Learning:NPU Support:Ethos-U Driver&Generic U85

    - component: Services:Secure Enclave:core&Source
    - component: Services:Secure Enclave:Initialization Helper&Source

  groups:
    - group: Board
      files:
        - file: ./main.c
        - file: ./main.h
        - file: ./DevKit-E8.h
        - file: ./ethos_setup.c
        # The console is a log buffer in the DTCM (console_log) that the debugger reads.
        - file: ./retarget_stdio_log.c
        - file: ./board_display.c
        - file: ./board_display.h

    - group: Ethos Interface
      files:
        - file: ./ethosu_cb_dcache.c

  # AC6 only: the MRAM layout of the cat detector (linker_ac6_yolo.sct.src).
  linker:
    - regions: ./RTE/Device/AE822FA0E5597LS0_M55_HP/app_mem_regions.h
    - script: ./linker_ac6_yolo.sct.src
      for-compiler: AC6
