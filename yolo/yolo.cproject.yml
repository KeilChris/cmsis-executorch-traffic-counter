#
# Cat detection with Ultralytics YOLO26n on the Ethos-U85 of the Alif
# Ensemble E8 (Cortex-M55 HP core), live from the camera to the panel, with SDS
# recording and playback of the model input: the network of model/yolo.py
# runs whole on the NPU, the CPU thresholds the scores and decodes the boxes.
# See documentation/yolo-cats.md.
#
# Before the first build:
#   MODEL_FLAVOR=yolo python create_ai_layer.py ai_layer_yolo/cmsis-executorch.cbuild-mlops.yml
#   python yolo/make_test_image.py
project:
  packs:
    - pack: PyTorch::ExecuTorch@1.5.1
    - pack: ARM::CMSIS

  misc:
    - CPP:
        - -std=gnu++17
        - -Wno-deprecated-declarations
    # The Ensemble pack's ISP library (libs/isp/libisp.a, the AppKit-E8's
    # camera path) is built with packed enums, and its structures cross the
    # driver interface: armlink refuses to mix it with the default 32-bit enums
    # (L6242E). The whole image uses packed enums.
    - for-compiler: AC6
      C-CPP:
        - -fshort-enums

  # Benchmark builds (documentation/yolo-cats.md): uncomment. For the program
  # in SRAM, the NPU must fetch the command stream and the weights through its
  # SRAM port: its EXT port reaches the MRAM, not the SRAM (a bus abort).
  # define:
  #   - YOLO_BENCHMARK: 50
  #   - YOLO_BENCHMARK_SRAM: 2688000   # bytes of SRAM0 for a copy of the program
  #   - NPU_QCONFIG: 0
  #   - NPU_REGIONCFG_0: 0

  groups:
    - group: App
      optimize: speed
      add-path:
        - ../src
      files:
        - file: ./app_yolo.cpp
        # YOLO26n on the NPU and the rest of its head on the CPU.
        - file: ./detector.cpp
        - file: ./detector.h
        # The Ethos-U driver waits on RTX semaphores, not in a __WFE loop.
        - file: ./ethosu_rtos.c
        # The camera (OV5675 through the ISP, or MT9M114 streaming) and the pixel work.
        - file: ./camera.c
        - file: ./camera.h
        - file: ./image.c
        - file: ./image.h
        # SDS recording and playback of the model input and the detections.
        - file: ./rec_play.c
        - file: ./rec_play.h
        - file: ./test_image.c
        - file: ./test_image.h
        # EmbeddedModule: ExecuTorch's Module class without the POSIX file
        # loading (BSD-3-Clause, see src/LICENSE-ExecuTorch).
        - file: ../src/arm_embedded_module.cpp
        - file: ../src/arm_embedded_module.hpp

  layers:
    - layer: $Yolo-Board-Layer$
      type: Board
    - layer: ../ai_layer_yolo/ai_layer.clayer.yml
      type: AI

  output:
    type:
      - elf
      - hex
      - map
