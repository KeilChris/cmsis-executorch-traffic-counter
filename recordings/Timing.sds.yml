sds:
  name: Timing
  description: Per-frame stage timings of the NPU render demo (microseconds), one record per recorded frame
  sample-frequency: 50
  content:
    - value: frame
      type: uint32_t
    - value: vertex_npu
      type: float
      unit: us
    - value: post_vertex
      type: float
      unit: us
    - value: raster
      type: float
      unit: us
    - value: shade_npu
      type: float
      unit: us
    - value: record
      type: float
      unit: us
    - value: frame_total
      type: float
      unit: us
