sds:
  name: CameraIn
  description: >-
    Model input of the YOLO26n cat detector, one frame per record: the centre
    square of the MT9M114 camera (640x480 RGB565) scaled to 416x416, RGB888.
    Recorded from the camera on the AppKit-E8; played back as the detector's
    input instead of the camera.
  tick-frequency: 1000
  content:
    - image:
        pixel_format: RGB888
        width: 416
        height: 416
        stride_bytes: 1248
