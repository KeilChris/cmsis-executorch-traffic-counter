sds:
  name: Detections
  description: >-
    Result of the YOLO26n cat detector for each frame (detections_t in
    yolo/detector.h): frame counter, number of cats, NPU and total time, then
    16 boxes (x1, y1, x2, y2 in pixels of the 416x416 input, and the score);
    the entries after `count` are zero.
  tick-frequency: 1000
  content:
    - value: frame
      type: uint32_t
    - value: count
      type: uint32_t
    - value: npu
      type: uint32_t
      unit: us
    - value: total
      type: uint32_t
      unit: us
    - value: x1_0
      type: float
    - value: y1_0
      type: float
    - value: x2_0
      type: float
    - value: y2_0
      type: float
    - value: score_0
      type: float
    - value: x1_1
      type: float
    - value: y1_1
      type: float
    - value: x2_1
      type: float
    - value: y2_1
      type: float
    - value: score_1
      type: float
    - value: x1_2
      type: float
