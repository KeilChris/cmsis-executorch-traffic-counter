#
# Quake on the NPU render pipeline: id Software's Quake (GPL-2.0-or-later) with
# its software renderer on the Cortex-M55 and, on the DevKit-E8, the Ethos-U85
# as the lighting / scaling back end. See documentation/npu-quake.md.
#
# The Quake source is not in this repository: run `python quake/fetch_quake.py`
# once; it clones the pinned upstream commit into quake/upstream/ and applies
# quake/patches/. The game data is yours to supply (shareware id1/pak0.pak).
project:
  packs:
    - pack: PyTorch::ExecuTorch@1.5.1
    - pack: ARM::CMSIS
    - pack: ARM::CMSIS-Compiler

  misc:
    - CPP:
        - -std=gnu++17
        - -Wno-deprecated-declarations

  components:
    # Quake reads its pak with stdio; platform/fs_pak_mem.c serves the pak
    # image in memory through the C library's file interface.
    - component: CMSIS-Compiler:File Interface:Custom

  groups:
    - group: Quake
      # The 1996 code base as it is: K&R-era C, plain char is signed, types
      # are punned freely, signed overflow wraps, and headers define globals
      # without `extern` (d_local.h: sadjust, bbextents, ...), which only
      # links when tentative definitions are common symbols.
      language-C: gnu90
      optimize: speed
      warnings: off
      add-path:
        - ./platform/compat
      misc:
        - for-compiler: AC6
          C:
            - -fsigned-char
            - -fno-strict-aliasing
            - -fwrapv
            - -fcommon
      files:
        - file: ./upstream/WinQuake/cl_demo.c
        - file: ./upstream/WinQuake/cl_input.c
        - file: ./upstream/WinQuake/cl_main.c
        - file: ./upstream/WinQuake/cl_parse.c
        - file: ./upstream/WinQuake/cl_tent.c
        - file: ./upstream/WinQuake/chase.c
        - file: ./upstream/WinQuake/cmd.c
        - file: ./upstream/WinQuake/common.c
        - file: ./upstream/WinQuake/console.c
        - file: ./upstream/WinQuake/crc.c
        - file: ./upstream/WinQuake/cvar.c
        - file: ./upstream/WinQuake/draw.c
        - file: ./upstream/WinQuake/d_edge.c
        - file: ./upstream/WinQuake/d_fill.c
        - file: ./upstream/WinQuake/d_init.c
        - file: ./upstream/WinQuake/d_modech.c
        - file: ./upstream/WinQuake/d_part.c
        - file: ./upstream/WinQuake/d_polyse.c
        - file: ./upstream/WinQuake/d_scan.c
        - file: ./upstream/WinQuake/d_sky.c
        - file: ./upstream/WinQuake/d_sprite.c
        - file: ./upstream/WinQuake/d_surf.c
        - file: ./upstream/WinQuake/d_vars.c
        - file: ./upstream/WinQuake/d_zpoint.c
        - file: ./upstream/WinQuake/host.c
        - file: ./upstream/WinQuake/host_cmd.c
        - file: ./upstream/WinQuake/keys.c
        - file: ./upstream/WinQuake/menu.c
        - file: ./upstream/WinQuake/mathlib.c
        - file: ./upstream/WinQuake/model.c
        - file: ./upstream/WinQuake/net_loop.c
        - file: ./upstream/WinQuake/net_main.c
        - file: ./upstream/WinQuake/net_vcr.c
        - file: ./upstream/WinQuake/net_none.c
        - file: ./upstream/WinQuake/nonintel.c
        - file: ./upstream/WinQuake/pr_cmds.c
        - file: ./upstream/WinQuake/pr_edict.c
        - file: ./upstream/WinQuake/pr_exec.c
        - file: ./upstream/WinQuake/r_aclip.c
        - file: ./upstream/WinQuake/r_alias.c
        - file: ./upstream/WinQuake/r_bsp.c
        - file: ./upstream/WinQuake/r_light.c
        - file: ./upstream/WinQuake/r_draw.c
        - file: ./upstream/WinQuake/r_efrag.c
        - file: ./upstream/WinQuake/r_edge.c
        - file: ./upstream/WinQuake/r_misc.c
        - file: ./upstream/WinQuake/r_main.c
        - file: ./upstream/WinQuake/r_sky.c
        - file: ./upstream/WinQuake/r_sprite.c
        - file: ./upstream/WinQuake/r_surf.c
        - file: ./upstream/WinQuake/r_part.c
        - file: ./upstream/WinQuake/r_vars.c
        - file: ./upstream/WinQuake/screen.c
        - file: ./upstream/WinQuake/sbar.c
        - file: ./upstream/WinQuake/sv_main.c
        - file: ./upstream/WinQuake/sv_phys.c
        - file: ./upstream/WinQuake/sv_move.c
        - file: ./upstream/WinQuake/sv_user.c
        - file: ./upstream/WinQuake/zone.c
        - file: ./upstream/WinQuake/view.c
        - file: ./upstream/WinQuake/wad.c
        - file: ./upstream/WinQuake/world.c
        - file: ./upstream/WinQuake/cd_null.c
        - file: ./upstream/WinQuake/snd_null.c
        - file: ./upstream/WinQuake/in_null.c

    - group: Quake platform
      optimize: speed
      add-path:
        - ./platform
        - ./upstream/WinQuake
        - ../src
        - ../board/DevKit-E8 # board_display.h
      files:
        - file: ./platform/port.h
        - file: ./platform/fs_pak_mem.c
        - file: ./platform/compat/compat.c
        - file: ./platform/port_fvp.c
          for-context: +SSE-320-U85
        - file: ./platform/port_alif.c
          for-context: [+DevKit-E8, +AppKit-E8, +AppKit-E8-HE]
        - file: ./platform/port_mem.c
          for-context: [+DevKit-E8, +AppKit-E8, +AppKit-E8-HE]
        - file: ./platform/port_mem.h
          for-context: [+DevKit-E8, +AppKit-E8, +AppKit-E8-HE]
        - file: ./platform/port_video.c
        - file: ./platform/port_splash.c
        - file: ./platform/port_splash.h
          for-context: [+DevKit-E8, +AppKit-E8, +AppKit-E8-HE]
        - file: ./platform/port_video.h
          for-context: [+DevKit-E8, +AppKit-E8, +AppKit-E8-HE]
        # The Ethos-U85 side: the ExecuTorch methods of model/quake.py, with
        # the runner's EmbeddedModule (BSD-3-Clause, see src/LICENSE-ExecuTorch).
        - file: ./platform/port_npu.cpp
          for-context: [+DevKit-E8, +AppKit-E8, +AppKit-E8-HE]
        - file: ./platform/port_npu.h
          for-context: [+DevKit-E8, +AppKit-E8, +AppKit-E8-HE]
        - file: ../src/arm_embedded_module.cpp
          for-context: [+DevKit-E8, +AppKit-E8, +AppKit-E8-HE]
        - file: ../src/arm_embedded_module.hpp
          for-context: [+DevKit-E8, +AppKit-E8, +AppKit-E8-HE]
        # Quake's own platform drivers, in Quake's dialect.
        - file: ./platform/sys_alif.c
          language-C: gnu90
          misc:
            - for-compiler: AC6
              C: [-fsigned-char, -fno-strict-aliasing, -fwrapv, -fcommon]
        - file: ./platform/vid_alif.c
          language-C: gnu90
          misc:
            - for-compiler: AC6
              C: [-fsigned-char, -fno-strict-aliasing, -fwrapv, -fcommon]

  layers:
    - layer: $Quake-Board-Layer$
      type: Board
    - layer: $AI-Layer$
      type: AI
      for-context: [+DevKit-E8, +AppKit-E8, +AppKit-E8-HE]

  output:
    type:
      - elf
      - hex
      - map
